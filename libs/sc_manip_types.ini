; =====================================================================================
;  DO NOT EDIT THIS FILE - it belongs to the plugin and is replaced by every update.
;
;  To use your own types or rules: copy this file to "custom_sc_manip_types.ini" in this
;  same folder (Resources/plugins/shared_cockpit/) and edit the copy. When the custom
;  file exists the plugin reads it instead of this one (the whole file, nothing merged).
; =====================================================================================
;
; shared_cockpit - OBJ manipulator types (ATTR_manip_<type>) and default sharing rules
;
; One [section] per manipulator type, without "ATTR_manip_". Comments start with ';'.
;   params = parameters before the tooltip (the cursor is 1)
;   refs   = which of them are the commands / datarefs / device name (1 or 2 numbers)
;   kind   = command | dataref | device     (device = owned by the aircraft: can't sync)
; [ignore]           types = types that are counted as "not used" (no control of their own)
; [local_by_default] words = words that make a control start unticked (kept local);
;                    matched in lower case inside its commands / datarefs and tooltip
; Parameters and refs are the same as in vrconfig_helper's manip_types.ini.

[file]
version = 1

[command]
params = 2
refs   = 2
kind   = command

[command_knob]
params = 3
refs   = 2 3
kind   = command

[command_knob2]
params = 2
refs   = 2
kind   = command

[command_switch_up_down]
params = 3
refs   = 2 3
kind   = command

[command_switch_left_right]
params = 3
refs   = 2 3
kind   = command

[command_switch_up_down2]
params = 2
refs   = 2
kind   = command

[command_switch_left_right2]
params = 2
refs   = 2
kind   = command

[command_axis]
params = 6
refs   = 5 6
kind   = command

[axis_knob]
params = 6
refs   = 6
kind   = dataref

[axis_switch_up_down]
params = 6
refs   = 6
kind   = dataref

[axis_switch_left_right]
params = 6
refs   = 6
kind   = dataref

[drag_axis]
params = 7
refs   = 7
kind   = dataref

[drag_axis_pix]
params = 7
refs   = 7
kind   = dataref

[drag_xy]
params = 9
refs   = 8 9
kind   = dataref

[drag_rotate]
params = 16
refs   = 15 16
kind   = dataref

[push]
params = 4
refs   = 4
kind   = dataref

[toggle]
params = 4
refs   = 4
kind   = dataref

[radio]
params = 3
refs   = 3
kind   = dataref

[delta]
params = 6
refs   = 6
kind   = dataref

[wrap]
params = 6
refs   = 6
kind   = dataref

[device]
params = 2
refs   = 2
kind   = device

[ignore]
types = none noop wheel keyframe

[local_by_default]
words = popup popout pop_out brightness _brt volume flood sim/view/ sim/graphics/ sim/operation/sound
words = toggle_yoke armrest toilet sunvisor sun_visor window_shade blind show_ hide_ yoke_hide efb tablet chocks_show
